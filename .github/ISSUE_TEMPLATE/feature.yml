name: Feature Request
description: >
  A request for a new feature to be added, for the software to do something that it did not previously do. Typically will take the form of a "User Story" and hence assumes that issue type.
type: Feature
labels: ["user story"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for making a suggestion of something new we should do.
        Usually, the more detail you can provide about what you think we should do, the easier it is to implement.
  - type: textarea
    id: requested-feature
    attributes:
      label: What are you asking for
      description: >
        Please describe what it is you want.
      placeholder: As a <>, I want <>, so that <>.  Please also add some acceptance criteria for this issue to be considered complete.
    validations:
      required: true
